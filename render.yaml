services:
  - type: web
    name: mp5-backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: VotingSystem
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FACE_SERVICE_URL
        fromService:
          type: web
          name: mp5-face-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FACE_SERVICE_API_KEY
        sync: false
      - key: FACE_ENCRYPTION_KEY
        sync: false
      - key: BLOCKCHAIN_BACKEND
        value: local

  - type: web
    name: mp5-face-service
    runtime: python
    plan: free
    rootDir: face-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FACE_SERVICE_API_KEY
        sync: false
      - key: FACE_DETECTION_SIZE
        value: "320"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: FACE_REQUIRE_ANTISPOOF
        value: "true"
      - key: FACE_ANTISPOOF_MODEL_A_PATH
        value: models/minifasnet_a.onnx
      - key: FACE_ANTISPOOF_MODEL_B_PATH
        value: models/minifasnet_b.onnx
